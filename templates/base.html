<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, #0f0f1a, #1c1c2e);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #ffffff !important;
        }

        .navbar-brand span {
            color: #6c63ff;
        }

        .nav-link {
            color: #e0e0e0 !important;
            font-weight: 500;
            margin: 0 8px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0%;
            height: 2px;
            background: #6c63ff;
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            color: #6c63ff !important;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link.active {
            color: #6c63ff !important;
        }

        .nav-link.active::after {
            width: 100%;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home_page' %}">My<span>Portfolio</span></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item">
                        <a class="nav-link {% block nav_home %}{% endblock %}" href="{% url 'home_page' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_about %}{% endblock %}" href="{% url 'about_page' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_contact %}{% endblock %}" href="{% url 'contact_page' %}">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    {% block content %}{% endblock %}

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
